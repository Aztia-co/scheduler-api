# Dependabot configuration file
# See https://docs.github.com/en/code-security/dependabot for details

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[no-review-app] deps"
    labels:
      - "dependencies"
